<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0d" />
    <title>KnowSayin</title>
    <meta
      name="description"
      content="KnowSayin turns rough dictated thinking-flow text into concise prompts while preserving intent."
    />
    <link rel="stylesheet" href="/static/site.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>KnowSayin</h1>
        <div class="top-actions">
          <a href="/download" id="downloadLink">Download</a>
          <a href="#" id="githubLink">GitHub</a>
          <div class="quota" id="quotaLine">额度 -</div>
        </div>
      </header>

      <section class="extra-panel" id="extraPanel" aria-labelledby="extraTitle" hidden>
        <div class="extra-head">
          <div>
            <p class="eyebrow">Get extra</p>
            <h2 id="extraTitle">选一句好话，免费补满额度</h2>
          </div>
          <p class="machine-line" id="machineLine"></p>
        </div>
        <div class="compliment-grid" id="complimentGrid" role="listbox" aria-label="Compliment options"></div>
        <button class="primary" id="extraButton" type="button">提交</button>
      </section>

      <section class="editor">
        <div class="field-meta">
          <label for="sourceText">原文</label>
          <span id="charCount">0 / 3000</span>
        </div>
        <textarea
          id="sourceText"
          autofocus
          maxlength="3000"
          placeholder="把语音转写、随手记录或粗糙想法粘贴在这里"
        ></textarea>
      </section>

      <div class="primary-actions">
        <button id="optimizeButton" class="primary" type="button">Optimize</button>
      </div>

      <section class="editor result-editor">
        <label for="resultText">结果</label>
        <textarea id="resultText" readonly placeholder="整理后的 prompt 会出现在这里"></textarea>
      </section>

      <div class="secondary-actions">
        <button id="copyButton" type="button" disabled>复制结果</button>
        <button id="clearButton" type="button">清除</button>
      </div>

      <p class="status" id="statusLine" role="status" aria-live="polite"></p>
    </main>

    <script src="/static/site.js"></script>
  </body>
</html>
