# KnowSayin Simplified Chinese Pinyin Schema
# Copyright KnowSayin. All rights reserved.

schema:
  schema_id: knowsayin_pinyin
  name: "知言拼音"
  version: "0.1.0"
  author: "KnowSayin"
  description: "Simplified Chinese pinyin input for KnowSayin IME"

switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "英文"]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba"
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/

translator:
  dictionary: pinyin_simp
  enable_sentence: false
  enable_user_dict: false
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([jqx])v/$1u/"
    - "xform/([a-z])v/$1ü/"

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"

punctuator:
  import_preset: symbols
